name: Social · cijfers vastleggen

# Dagelijks een momentopname van gebruik (Supabase), Instagram-inzichten en de
# content-pijplijn in social/stats/<datum>.json. Zo ziet Jarvis trends over weken.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    if: vars.SOCIAL_AAN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cijfers verzamelen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/social/stats.mjs
      - name: Vastleggen
        run: |
          git config user.name  "slagio-bot"
          git config user.email "slagio-bot@users.noreply.github.com"
          git add social/stats
          git diff --cached --quiet || { git commit -m "social: cijfers $(date -u +%F) [skip ci]"; git pull --rebase origin main && git push; }
