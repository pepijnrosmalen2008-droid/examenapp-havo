name: Social · publiceren

# Plaatst goedgekeurde (= gemergde) posts op het geplande moment via de
# officiële Instagram Graph API. De cron draait vlak na de vaste postmomenten
# (07:45, 17:00, 17:30, 19:30 NL-tijd, zomer én winter) i.p.v. elk kwartier:
# 10 runs per dag houdt het ruim binnen de gratis Actions-minuten.
# Hoofdschakelaar: repository-variabele SOCIAL_AAN = true.
on:
  schedule:
    - cron: '50 5,6 * * *'
    - cron: '5,35 15-18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen tonen wat er zou gebeuren'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-publiceer
  cancel-in-progress: false

jobs:
  publiceer:
    if: vars.SOCIAL_AAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Posts plaatsen die aan de beurt zijn
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/social/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Oude media opruimen
        run: node scripts/social/publish.mjs --opruimen
      - name: Status terugschrijven
        run: |
          if [ -n "$(git status --porcelain social)" ]; then
            git config user.name  "slagio-bot"
            git config user.email "slagio-bot@users.noreply.github.com"
            git add social
            git commit -m "social: publicatiestatus bijgewerkt [skip ci]"
            git pull --rebase origin main && git push
          fi
