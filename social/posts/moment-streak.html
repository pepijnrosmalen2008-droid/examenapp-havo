<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Slagio · Moment · Streak</title>
<link rel="stylesheet" href="../basis.css">
</head>
<body>
<div class="mo-canvas"></div>
<script src="../../mascotte.js"></script>
<script src="../engine.js"></script>
<script src="../geluid.js"></script>
<script src="../../momenten.js"></script>
<script>
// Streak. Het moment zelf staat in /momenten.js (dezelfde code draait in de app).
// ?dagen=7 (de nieuwe stand), ?f=reel voor staand formaat met haak en merk.
const q=new URLSearchParams(location.search),reel=q.get('f')==='reel';
const m=Momenten.maak('streak',document.querySelector('.mo-canvas'),Object.assign({ dagen: +(q.get('dagen')||7), niveau:q.get('niveau')||'havo', icoon:'../../icon-512.png' },
  reel?{H:1920,S:.84,CY:910,video:true}:{H:1080}));
window.__COVER=m.cover;
Motion.maak({duur:m.duur,render:m.render,geluid:m.geluid});
</script>
</body></html>
