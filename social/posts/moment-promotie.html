<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Slagio · Moment · Promotie</title>
<link rel="stylesheet" href="../basis.css">
</head>
<body>
<div class="mo-canvas"></div>
<script src="../../mascotte.js"></script>
<script src="../engine.js"></script>
<script src="../geluid.js"></script>
<script src="../../momenten.js"></script>
<script>
// Promotie. Het moment zelf staat in /momenten.js (dezelfde code draait in de app).
// ?van=Brons&naar=Zilver (namen uit LEAGUE_DIVISIONS in league.js), ?f=reel voor staand formaat met haak en merk.
const q=new URLSearchParams(location.search),reel=q.get('f')==='reel';
const m=Momenten.maak('promotie',document.querySelector('.mo-canvas'),Object.assign({ van: q.get('van'), naar: q.get('naar'), niveau:q.get('niveau')||'havo', icoon:'../../icon-512.png' },
  reel?{H:1920,S:.84,CY:910,video:true}:{H:1080}));
window.__COVER=m.cover;
Motion.maak({duur:m.duur,render:m.render,geluid:m.geluid});
</script>
</body></html>
