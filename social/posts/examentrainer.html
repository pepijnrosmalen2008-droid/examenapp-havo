<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Slagio · Reel · Examentrainer</title>
<link rel="stylesheet" href="../basis.css">
<style>
.mo-canvas{width:1080px;height:1920px;background:#12131c}
.bg{inset:0;background:radial-gradient(90% 55% at 100% 0%,rgba(216,172,82,.35),rgba(216,172,82,0) 60%),radial-gradient(80% 50% at 0% 100%,rgba(216,172,82,.18),rgba(216,172,82,0) 60%),#12131c}
.raster{inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.5px);background-size:44px 44px}
.midden{left:0;right:0;text-align:center}
.w{display:inline-block}
.intro{font:800 150px/.95 var(--kop);color:#fff;letter-spacing:-.045em;word-spacing:.06em}
.intro .or{background:linear-gradient(180deg,#f6dfa6,#d8ac52 55%,#a9781a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:700 52px/1 var(--kop);color:rgba(255,255,255,.72);letter-spacing:-.02em}
.stap{left:0;right:0;top:92px;display:flex;justify-content:center}
.stap .pil{display:inline-flex;align-items:center;gap:22px;padding:18px 36px 18px 18px;border-radius:999px;background:#fff;color:#12131c;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.stap b{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#f6dfa6,#a9781a);display:grid;place-items:center;font:800 42px/1 var(--kop);color:#fff}
.stap span{font:800 52px/1 var(--kop);letter-spacing:-.02em;white-space:nowrap}
.bolletjes{left:0;right:0;top:218px;display:flex;justify-content:center;gap:14px}
.bolletjes i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2)}
.bolletjes i.aan{background:#d8ac52;width:40px;border-radius:8px}
.slot{font:800 112px/1.02 var(--kop);color:#fff;letter-spacing:-.04em;word-spacing:.06em}
.merk{display:inline-flex;align-items:center;gap:26px;font:800 76px/1 var(--kop);color:#fff;letter-spacing:-.02em}
.merk img{width:118px;height:118px;border-radius:30px}
.tags{font:600 38px/1 var(--tekst);color:rgba(255,255,255,.6)}
.voorbeeld{left:50%;transform:translateX(-50%);top:1500px;z-index:3;padding:12px 22px;border-radius:999px;background:rgba(18,19,28,.84);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);font:700 28px/1 var(--tekst);color:#fff;white-space:nowrap}
.mascotte{left:50%;width:520px;height:520px;margin-left:-260px}
.mascotte svg{width:100%;height:100%;overflow:visible}
</style></head>
<body>
<div class="mo-canvas" id="c">
  <div class="abs bg"></div><div class="abs raster"></div>
  <div class="abs midden intro" id="intro" style="top:620px;font-size:132px"><span class="w">De</span><br><span class="w or">Examen­trainer</span></div>
  <div class="abs midden sub" id="sub" style="top:960px">Weet waar je staat.</div>
  <div class="abs stap" id="stap"><span class="pil"><b id="stapnr">1</b><span id="staptxt"></span></span></div>
  <div class="abs bolletjes" id="bol"><i></i><i></i><i></i><i></i></div>
  <div class="telefoon" id="tel" style="left:186px;top:290px"><div class="scherm"><img id="film" alt=""></div><div class="eiland"></div></div>
  <div class="abs mascotte" id="vonk" style="top:330px"></div>
  <div class="abs midden slot" id="slot" style="top:900px"><span class="w">Weet</span> <span class="w">wat</span> <span class="w">je</span><br><span class="w">moet</span> <span class="w">doen.</span></div>
  <div class="abs midden" id="merk" style="top:1170px"><span class="merk"><img src="../../icon-512.png" alt="">slagio.nl</span></div>
  <div class="abs midden tags" id="tags" style="top:1330px">Examentrainer in de app</div>
  <div class="abs voorbeeld" id="vb">Voorbeeld met oefendata</div>
</div>
<script src="../../mascotte.js"></script>
<script src="../engine.js"></script>
<script src="../geluid.js"></script>
<script>
const {p,E,lerp,zet,$}=Motion;
$('#vonk').innerHTML=mascotSVG('trots',520);
const IN=1.7;                       // film begint hier
const STAPPEN=[[0,'Weet waar je staat'],[3.3,'Je plan voor vandaag'],[5.7,'Je verwachte cijfer'],[7.4,'Waar je punten laat liggen']];
let F=null,UIT=0;
const klaar=Motion.laadFilm($('#film'),'trainer').then(f=>{F=f;UIT=IN+f.duur;});
const woorden=[...document.querySelectorAll('#intro .w')],slotw=[...document.querySelectorAll('#slot .w')];
const pop=(els,t,t0,stap,dy=60)=>els.forEach((el,i)=>{const x=p(t,t0+i*stap,t0+i*stap+.4,E.terug);zet(el,{opacity:String(Math.min(1,x*1.6)),transform:`translateY(${lerp(dy,0,x)}px) scale(${lerp(.85,1,x)})`});});
window.__COVER=IN+6.6;

function render(t){
  // Intro
  const introUit=p(t,IN-.45,IN-.05,E.in);
  pop(woorden,t,.1,.12);zet($('#intro'),{opacity:String(1-introUit),transform:`translateY(${-introUit*200}px)`});
  const sb=p(t,.6,1,E.uit);zet($('#sub'),{opacity:String(sb*(1-introUit)),transform:`translateY(${lerp(30,0,sb)-introUit*200}px)`});
  // Telefoon komt omhoog, en gaat aan het eind weer weg
  const tin=p(t,IN-.5,IN+.1,E.uit5),tuit=p(t,UIT,UIT+.5,E.in);
  zet($('#tel'),{transform:`translateY(${lerp(1900,0,tin)+tuit*2100}px) rotate(${lerp(4,0,tin)-tuit*3}deg)`});
  // Stap-label
  const ft=t-IN;let s=0;STAPPEN.forEach((x,i)=>{if(ft>=x[0])s=i;});
  const s0=STAPPEN[s][0];const wissel=p(ft,s0,s0+.35,E.terug);
  $('#stapnr').textContent=String(s+1);$('#staptxt').textContent=STAPPEN[s][1];
  const zichtbaar=p(t,IN,IN+.3)*(1-p(t,UIT-.2,UIT+.1));
  zet($('#stap'),{opacity:String(zichtbaar),transform:`scale(${lerp(.8,1,wissel)}) translateY(${lerp(-20,0,wissel)}px)`});
  zet($('#bol'),{opacity:String(zichtbaar)});zet($('#vb'),{opacity:String(zichtbaar)});[...$('#bol').children].forEach((el,i)=>el.classList.toggle('aan',i===s));
  // Slot
  const inS=t>UIT;
  const m=p(t,UIT+.2,UIT+.9,E.veer);zet($('#vonk'),{opacity:String(inS?Math.min(1,m*2):0),transform:`translateY(${lerp(200,0,Math.min(1,m))+(t>UIT+.9?Math.sin((t-UIT)*3)*10:0)}px) scale(${lerp(.4,1,m)})`});
  pop(slotw,t,UIT+.5,.14,70);slotw.forEach(el=>{if(!inS)el.style.opacity='0';});
  const mk=p(t,UIT+.9,UIT+1.3,E.uit);zet($('#merk'),{opacity:String(mk),transform:`translateY(${lerp(50,0,mk)}px)`});
  const tg=p(t,UIT+1.1,UIT+1.5,E.uit);zet($('#tags'),{opacity:String(tg),transform:`translateY(${lerp(40,0,tg)}px)`});
  return F?F.op(Math.max(0,Math.min(F.duur-1/30,ft))):null;
}
const START=Motion.maak;
klaar.then(()=>{
  const G=[],g=(t,n,v,x)=>G.push([t,n,v,x]);
  g(.1,'pop',.6);g(.6,'tap',.4);g(IN-.5,'whoosh',.8);
  STAPPEN.forEach(([s])=>g(IN+s,'pop',.55));
  F.meta.tikken.forEach(k=>g(IN+k.t,'tap',.8));
  g(IN+5.8,'badge',.5);g(IN+7.5,'tick',.4,600);
  g(UIT,'whoosh',.8);g(UIT+.2,'evolve',.8);g(UIT+.9,'start',.6);
  window.__GELUID=G;
});
Motion.maak({duur:13.2,render,klaar,geluid:null});
</script>
</body></html>
