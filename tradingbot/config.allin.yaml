# ═══════════════════════════════════════════════════════════════════════════
#  ALL-IN BOT — één bot die alles kan: prijsstrategie + nieuws + politici +
#  on-chain, met volledige risk-engine, execution-meting en gedachtegang.
#  Eigen verse database (autopilot_allin.db) → geen gedoe met oude bots.
#
#  METEEN DRAAIEN (geen API-key nodig):   py bot.py --config config.allin.yaml
#  Status bekijken:                        py status.py --db autopilot_allin.db
#
#  BITVAVO-KEY AANSLUITEN: zet BITVAVO_API_KEY/SECRET in .env. Deze bot blijft
#  dan nog steeds PAPER (veilig, verzint geen echte orders). Wil je het volledige
#  live-pad draaien mét je echte saldo als limiet, maar ZONDER orders te sturen,
#  zet dan mode: SHADOW hieronder. Pas LIVE (echt geld) na de drie-slot-guardrail
#  in .env.example — bewust niet standaard aan.
# ═══════════════════════════════════════════════════════════════════════════

mode: PAPER
bot_id: allin
capital_eur: 100

pairs: [BTC-EUR, ETH-EUR, SOL-EUR, MOODENG-EUR]

seed:
  enabled: true
  eur: 100                    # start met €100 papieren cash; pas aan naar wens

risk:
  max_position_pct: 15        # kleinere posities → kan over méér munten tegelijk spreiden
  stop_loss_pct: 15
  take_profit_pct: 25
  max_daily_loss_pct: 15
  max_drawdown_pct: 40
  max_portfolio_heat_pct: null

# De self-learning strategie: beslist op de forward-only geleerde factor-overtuiging
# (prijsfactoren + nieuws/politici/on-chain), gewogen met wat aantoonbaar heeft gewerkt.
# Verschuift over tijd vanzelf naar wat edge had — mits er edge te vinden is.
strategy:
  name: adaptive
  params:
    buy_threshold: 0.20       # koopt al bij een gematigd-positieve overtuiging → handelt actief
    sell_threshold: -0.10     # verkoopt zodra de overtuiging kantelt
    min_confidence: 0.10      # lage drempel: hij mag breed handelen (en leert van elke uitkomst)
    max_positions: 8          # mag over veel munten tegelijk gespreid zitten

# ALLE informatiebronnen tegelijk. Elke bron is een PROBE: hij mag voorstellen doen,
# maar alles gaat door de confidence-poort én de risk engine, en wordt forward-only
# per bron/entiteit afgerekend. Een lege bronlijst doet simpelweg niets.
research:
  enabled: true
  agent: allin
  min_confidence: 0.6
  max_position_eur: 20
  events_file: research_events.json     # handmatige events blijven mogelijk
  fetch_minutes: 15
  news_sources:
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://www.newsbtc.com/feed/
    - https://cryptopotato.com/feed/
    - https://ambcrypto.com/feed/
    - https://beincrypto.com/feed/
    - https://bitcoinist.com/feed/
    - https://u.today/rss
    - https://bitcoinmagazine.com/feed
  disclosure_sources: []                 # gratis keyless politici-TRADE-datasets zijn dood (403);
                                         # met een API-sleutel (Quiver/Unusual Whales) later te wiren
  onchain_sources: []                    # vul je eigen whale/flow-JSON-bron in (optioneel ONCHAIN_API_KEY in .env)

schedule:
  interval_minutes: 15

# Circuit breaker gelijkgetrokken met de universe-filter.
circuit_breaker:
  max_spread_pct: 1.5

# Breed scannen: zoveel mogelijk munten overwegen zodat hij overal van kan leren en handelen.
# Een bodem op volume/spread blijft nodig, anders kunnen orders niet fatsoenlijk vullen.
universe:
  enabled: true
  min_daily_volume_eur: 25000
  max_spread_pct: 1.5
  max_markets: 150
  always_include: [BTC-EUR, ETH-EUR, SOL-EUR, MOODENG-EUR]

costs:
  taker_fee_pct: 0.25
  maker_fee_pct: 0.15
  slippage_pct: 0.1

execution:
  mode: taker                 # eerlijk in PAPER; maker_first pas na fill-validatie in SHADOW/LIVE
